name: Watch PAGASA NCR-PRSD Advisories

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs slightly during
    # periods of high platform load -- this is normal and free of charge.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test message to Discord instead of checking for real advisories"
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run advisory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python watch_pagasa.py --test
          else
            python watch_pagasa.py
          fi

      - name: Commit updated state (if changed)
        run: |
          git config user.name "pagasa-advisory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f data/ph_provinces.geojson ]; then
            git add data/ph_provinces.geojson
          fi
          git diff --quiet --cached || git commit -m "Update advisory state"
          git push
