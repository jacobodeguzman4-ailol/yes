name: Watch PAGASA NCR-PRSD Advisories

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs slightly during
    # periods of high platform load -- this is normal and free of charge.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run advisory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch_pagasa.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "pagasa-advisory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update advisory state"
          git push
