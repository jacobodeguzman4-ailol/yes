name: Watch PAGASA NCR-PRSD Advisories

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs slightly during
    # periods of high platform load -- this is normal and free of charge.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test message to Discord instead of checking for real advisories"
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

# Queue runs instead of letting them overlap: a scheduled trigger firing
# while a previous run (or a manual test run) is still in progress used to
# be able to race on the git push at the end and fail with a rejected,
# non-fast-forward push. cancel-in-progress: false means a queued run
# waits its turn rather than being killed, so no check is ever skipped.
concurrency:
  group: pagasa-advisory-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run advisory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python watch_pagasa.py --test
          else
            python watch_pagasa.py
          fi

      - name: Commit updated state (if changed)
        run: |
          git config user.name "pagasa-advisory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f data/ph_provinces.geojson ]; then
            git add data/ph_provinces.geojson
          fi
          if git diff --quiet --cached; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update advisory state"
          # The concurrency group above should make this unnecessary, but
          # retry once with a rebase in case something external touched the
          # branch between checkout and push (e.g. a manual push by you).
          for attempt in 1 2; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling and retrying (attempt $attempt)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
