name: Watch QC Class/Work Suspension Announcements

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test message to Discord instead of checking for real announcements"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qc-suspension-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run suspension check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python watch_qc_suspension.py --test
          else
            python watch_qc_suspension.py
          fi

      - name: Commit updated state (if changed)
        run: |
          git config user.name "qc-suspension-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qc_state.json
          if git diff --quiet --cached; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update QC suspension state"
          for attempt in 1 2; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling and retrying (attempt $attempt)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
