name: Watch QC Class/Work Suspension Announcements

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test message to Discord instead of checking for real announcements"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run suspension check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python watch_qc_suspension.py --test
          else
            python watch_qc_suspension.py
          fi

      - name: Commit updated state (if changed)
        run: |
          git config user.name "qc-suspension-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qc_state.json
          git diff --quiet --cached || git commit -m "Update QC suspension state"
          git push
