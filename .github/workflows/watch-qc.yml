name: Watch QC Class/Work Suspension Announcements

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run suspension check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch_qc_suspension.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "qc-suspension-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qc_state.json
          git diff --quiet --cached || git commit -m "Update QC suspension state"
          git push
